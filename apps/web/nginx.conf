server {
  listen 80;
  root /usr/share/nginx/html;
  client_max_body_size 25m;

  # Same-origin API: the browser never needs CORS.
  location /api/ {
    proxy_pass http://api:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Request-Id $request_id;
    # nginx is the edge, so it *replaces* any client-sent X-Forwarded-For with the
    # real peer address; appending would let clients spoof their IP past rate limits.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Answers are streamed (SSE); don't buffer them.
    proxy_buffering off;
    proxy_read_timeout 300s;
  }

  # SPA fallback.
  location / {
    try_files $uri /index.html;
  }
}
